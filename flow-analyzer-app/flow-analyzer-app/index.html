<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>هندسة التدفق — افحصي تدفق مساحتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --ink: #1F2E27; --paper: #F5EFE3; --paperSoft: #EFE7D6;
    --clay: #A85C43; --brass: #A9822F; --sage: #7C8A72; --line: #D8CDB4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Tajawal', sans-serif; background: var(--paper); color: var(--ink); }
  .fa-root { min-height: 100vh; padding: 32px 18px 56px; }
  .fa-shell { max-width: 620px; margin: 0 auto; }
  .fa-eyebrow { font-size: 12px; letter-spacing: 1px; color: var(--brass); font-weight: 700; margin: 0 0 6px; }
  .fa-hero-title { font-family: 'El Messiri', serif; font-size: 34px; font-weight: 700; margin: 0 0 10px; line-height: 1.25; }
  .fa-hero-sub { font-size: 15px; color: #4A5750; line-height: 1.7; margin: 0 0 22px; max-width: 46ch; }
  .fa-flow-path { stroke-dasharray: 700; stroke-dashoffset: 700; }
  .fa-flow-path-drawn { animation: fa-draw 1.4s ease forwards; }
  @keyframes fa-draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .fa-flow-path-drawn { animation: none; stroke-dashoffset: 0; } }
  .fa-dropzone { position: relative; display: block; border: 1.5px dashed var(--line); border-radius: 4px; background: #FFFDF8; padding: 36px 20px; text-align: center; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .fa-dropzone:hover, .fa-dropzone.drag { border-color: var(--brass); background: var(--paperSoft); }
  .fa-dropzone p { margin: 10px 0 2px; font-weight: 700; font-size: 15px; }
  .fa-dropzone span { font-size: 13px; color: #7A8177; }
  .fa-dz-icon { width: 42px; height: 42px; border-radius: 50%; background: var(--paperSoft); display: flex; align-items: center; justify-content: center; margin: 0 auto; color: var(--clay); font-size: 18px; }
  .fa-preview-wrap { border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .fa-preview-wrap img { width: 100%; display: block; max-height: 260px; object-fit: cover; }
  .fa-field { margin-bottom: 16px; }
  .fa-field label { display: block; font-size: 12px; font-weight: 700; color: var(--sage); margin-bottom: 6px; }
  .fa-select, .fa-textarea { width: 100%; font-family: 'Tajawal', sans-serif; font-size: 14.5px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 3px; background: #FFFDF8; color: var(--ink); }
  .fa-select:focus, .fa-textarea:focus, .fa-dropzone:focus-visible, .fa-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .fa-textarea { resize: vertical; min-height: 68px; }
  .fa-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--paper); font-family: 'Tajawal', sans-serif; font-weight: 700; font-size: 14.5px; border: none; border-radius: 3px; padding: 13px 22px; cursor: pointer; width: 100%; justify-content: center; }
  .fa-btn:hover { background: #142019; }
  .fa-btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-top: 10px; }
  .fa-btn-ghost:hover { background: var(--paperSoft); }
  .fa-loading { text-align: center; padding: 60px 10px; }
  .fa-loading p { margin-top: 18px; font-size: 14px; color: #6B756A; }
  .fa-spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--paperSoft); border-top-color: var(--brass); margin: 0 auto; animation: fa-spin 0.9s linear infinite; }
  @keyframes fa-spin { to { transform: rotate(360deg); } }
  .fa-impression { text-align: center; font-size: 14.5px; line-height: 1.8; color: #454F49; max-width: 44ch; margin: 6px auto 4px; }
  .fa-card { background: #FFFDF8; border: 1px solid var(--line); border-radius: 4px; padding: 18px 18px 14px; margin-bottom: 14px; }
  .fa-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .fa-card-icon { color: var(--brass); font-size: 15px; }
  .fa-card-head h3 { font-family: 'El Messiri', serif; font-size: 17px; margin: 0; font-weight: 700; }
  .fa-card-analysis { font-size: 14px; line-height: 1.8; color: #454F49; margin: 4px 0 8px; }
  .fa-list { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .fa-list li { display: flex; align-items: flex-start; gap: 7px; font-size: 13.5px; line-height: 1.6; }
  .fa-list-good li:before { content: "✓"; color: var(--sage); font-weight: 700; }
  .fa-list-warn li:before { content: "!"; color: var(--clay); font-weight: 700; }
  .fa-list-sug li:before { content: "←"; color: var(--brass); font-weight: 700; }
  .fa-priority { background: var(--ink); color: var(--paper); border-radius: 4px; padding: 20px; margin: 18px 0; }
  .fa-priority h3 { font-family: 'El Messiri', serif; font-size: 17px; margin: 0 0 10px; }
  .fa-priority ol { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 8px; }
  .fa-priority li { font-size: 14px; line-height: 1.6; }
  .fa-cta { text-align: center; padding: 22px 16px; border: 1px dashed var(--line); border-radius: 4px; margin-top: 8px; }
  .fa-cta p { margin: 0 0 12px; font-size: 14px; color: #454F49; }
  .fa-error { text-align: center; padding: 40px 14px; }
  .fa-error p { font-size: 14.5px; margin-bottom: 18px; }
  .fa-brand-foot { text-align: center; margin-top: 28px; font-size: 11.5px; color: #9BA396; letter-spacing: .5px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback } = React;

const ROOM_TYPES = ["مطبخ", "غرفة معيشة", "غرفة نوم", "غرفة أطفال", "حمام", "مساحة عمل / مكتب", "أخرى"];
const SECTION_META = {
  layout: { title: "التصميم العام وتدفق الحركة", icon: "◐" },
  colors: { title: "الألوان", icon: "◑" },
  lighting: { title: "الإضاءة", icon: "◒" },
  ergonomics: { title: "الإرغونوميا", icon: "◓" },
  fengshui: { title: "الفنغ شوي والطاقة", icon: "◔" },
};

function FlowDivider({ drawn }) {
  return (
    <svg viewBox="0 0 600 40" style={{ width: "100%", height: 28, display: "block" }} aria-hidden="true">
      <path d="M0,20 C100,0 150,40 250,20 C350,0 400,40 500,20 C550,10 570,25 600,18"
        fill="none" stroke="#A9822F" strokeWidth="2" strokeLinecap="round"
        className={drawn ? "fa-flow-path fa-flow-path-drawn" : "fa-flow-path"} />
    </svg>
  );
}

function ScoreBadge({ score }) {
  const pct = Math.max(0, Math.min(10, Number(score) || 0)) * 10;
  return (
    <svg viewBox="0 0 120 120" width="108" height="108" style={{ display: "block", margin: "0 auto" }}>
      <circle cx="60" cy="60" r="52" fill="none" stroke="#EFE7D6" strokeWidth="10" />
      <circle cx="60" cy="60" r="52" fill="none" stroke="#A85C43" strokeWidth="10" strokeLinecap="round"
        strokeDasharray={`${(pct / 100) * 326.7} 326.7`} transform="rotate(-90 60 60)" />
      <text x="60" y="56" textAnchor="middle" fontSize="30" fontWeight="700" fill="#1F2E27" fontFamily="El Messiri, serif">{score}</text>
      <text x="60" y="76" textAnchor="middle" fontSize="11" fill="#7C8A72" fontFamily="Tajawal, sans-serif">من 10</text>
    </svg>
  );
}

function SectionCard({ meta, data }) {
  return (
    <div className="fa-card">
      <div className="fa-card-head"><span className="fa-card-icon">{meta.icon}</span><h3>{meta.title}</h3></div>
      {data.analysis && <p className="fa-card-analysis">{data.analysis}</p>}
      {data.strengths?.length > 0 && <ul className="fa-list fa-list-good">{data.strengths.map((s, i) => <li key={i}>{s}</li>)}</ul>}
      {data.issues?.length > 0 && <ul className="fa-list fa-list-warn">{data.issues.map((s, i) => <li key={i}>{s}</li>)}</ul>}
      {data.suggestions?.length > 0 && <ul className="fa-list fa-list-sug">{data.suggestions.map((s, i) => <li key={i}>{s}</li>)}</ul>}
    </div>
  );
}

const ANALYSES_PER_PAYMENT = 10;

function PaywallGate({ onUnlock }) {
  const [status, setStatus] = useState("checking"); // checking | locked | error

  React.useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");
    if (!sessionId) {
      setStatus("locked");
      return;
    }
    fetch(`/api/verify-payment?session_id=${encodeURIComponent(sessionId)}`)
      .then((r) => r.json())
      .then((data) => {
        if (data.paid) {
          sessionStorage.setItem("fa_paid_session", sessionId);
          sessionStorage.setItem("fa_analyses_remaining", String(ANALYSES_PER_PAYMENT));
          onUnlock(ANALYSES_PER_PAYMENT);
        } else {
          setStatus("locked");
        }
      })
      .catch(() => setStatus("error"));
  }, []);

  if (status === "checking") {
    return (
      <div className="fa-root">
        <div className="fa-shell">
          <div className="fa-loading"><div className="fa-spin" /><p>عم نتأكد من الدفع...</p></div>
        </div>
      </div>
    );
  }

  return (
    <div className="fa-root">
      <div className="fa-shell">
        <p className="fa-eyebrow">هندسة التدفق</p>
        <h1 className="fa-hero-title">افحصي تدفق مساحتك</h1>
        <p className="fa-hero-sub">هاد التحليل خدمة مدفوعة. لازم تدفعي أولاً عشان تفتحي الأداة.</p>
        <div className="fa-cta" style={{ marginTop: 22 }}>
          <p>{status === "error" ? "صار خلل بالتحقق من الدفع، جربي الرابط تاني." : "بعد الدفع رح تنفتحلك الأداة تلقائياً."}</p>
          <a href="https://buy.stripe.com/test_7sY8wP0PTb7N3bMfiHak000" className="fa-btn" style={{ width: "auto", padding: "12px 26px", textDecoration: "none", display: "inline-flex" }}>
            ادفعي وافحصي مساحتك
          </a>
        </div>
      </div>
    </div>
  );
}

function FlowAnalyzer() {
  const [unlocked, setUnlocked] = useState(() => !!sessionStorage.getItem("fa_paid_session"));
  const [remaining, setRemaining] = useState(() => {
    const stored = sessionStorage.getItem("fa_analyses_remaining");
    return stored ? parseInt(stored, 10) : 0;
  });
  const [step, setStep] = useState("upload");
  const [imageData, setImageData] = useState(null);
  const [roomType, setRoomType] = useState(ROOM_TYPES[0]);
  const [notes, setNotes] = useState("");
  const [report, setReport] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [dragOver, setDragOver] = useState(false);
  const fileInputRef = useRef(null);

  const handleFile = useCallback((file) => {
    if (!file || !file.type.startsWith("image/")) {
      setErrorMsg("لازم ترفعي صورة (jpg أو png).");
      setStep("error");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      setImageData({ base64: result.split(",")[1], mediaType: file.type, previewUrl: result });
      setStep("form");
    };
    reader.onerror = () => { setErrorMsg("ما قدرنا نقرأ الصورة. جربي صورة تانية."); setStep("error"); };
    reader.readAsDataURL(file);
  }, []);

  const onDrop = (e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files?.[0]); };

  const runAnalysis = async () => {
    setStep("loading"); setErrorMsg("");
    try {
      const res = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imageBase64: imageData.base64, mediaType: imageData.mediaType, roomType, notes }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "analysis failed");
      setReport(data.report);
      setStep("result");
      const newRemaining = Math.max(0, remaining - 1);
      setRemaining(newRemaining);
      sessionStorage.setItem("fa_analyses_remaining", String(newRemaining));
    } catch (err) {
      console.error(err);
      setErrorMsg("صار خلل بالتحليل. جربي كمان مرة.");
      setStep("error");
    }
  };

  const reset = () => {
    setImageData(null); setReport(null); setNotes(""); setRoomType(ROOM_TYPES[0]); setErrorMsg("");
    if (remaining <= 0) {
      sessionStorage.removeItem("fa_paid_session");
      sessionStorage.removeItem("fa_analyses_remaining");
      setUnlocked(false);
    } else {
      setStep("upload");
    }
  };

  if (!unlocked) {
    return <PaywallGate onUnlock={(count) => { setRemaining(count); setUnlocked(true); }} />;
  }

  return (
    <div className="fa-root">
      <div className="fa-shell">
        <p className="fa-eyebrow">هندسة التدفق</p>
        <h1 className="fa-hero-title">افحصي تدفق مساحتك</h1>
        <p className="fa-hero-sub">ارفعي صورة لأي ركن ببيتك، وخدي تحليل شامل: التصميم العام، الألوان، الإضاءة، الإرغونوميا، والفنغ شوي — بدقيقة.</p>
        <p style={{ fontSize: 13, color: "#7C8A72", fontWeight: 700, marginTop: -8 }}>باقيلك {remaining} من أصل {ANALYSES_PER_PAYMENT} تحليل بهاي الدفعة</p>
        <FlowDivider drawn={step === "upload"} />

        {step === "upload" && (
          <div style={{ marginTop: 22 }}>
            <label htmlFor="fa-file-input" className={`fa-dropzone${dragOver ? " drag" : ""}`}
              onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)} onDrop={onDrop}>
              <div className="fa-dz-icon">↑</div>
              <p>اسحبي الصورة هون أو دوسي للاختيار</p>
              <span>JPG أو PNG</span>
              <input id="fa-file-input" ref={fileInputRef} type="file" accept="image/*"
                style={{ position: "absolute", width: 1, height: 1, opacity: 0, overflow: "hidden" }}
                onChange={(e) => handleFile(e.target.files?.[0])} />
            </label>
          </div>
        )}

        {step === "form" && imageData && (
          <div style={{ marginTop: 20 }}>
            <div className="fa-preview-wrap"><img src={imageData.previewUrl} alt="معاينة المساحة" /></div>
            <div className="fa-field">
              <label>نوع المساحة</label>
              <select className="fa-select" value={roomType} onChange={(e) => setRoomType(e.target.value)}>
                {ROOM_TYPES.map((r) => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>
            <div className="fa-field">
              <label>في إشي حابة تذكريه؟ (اختياري)</label>
              <textarea className="fa-textarea" placeholder="مثلاً: بيت صغير، عيلة فيها أطفال..."
                value={notes} onChange={(e) => setNotes(e.target.value)} />
            </div>
            <button className="fa-btn" onClick={runAnalysis}>✦ حللي المساحة</button>
            <button className="fa-btn fa-btn-ghost" onClick={reset}>↻ صورة تانية</button>
          </div>
        )}

        {step === "loading" && (
          <div className="fa-loading"><div className="fa-spin" /><p>عم نلاحظ التدفق، الألوان، والإضاءة بمساحتك...</p></div>
        )}

        {step === "error" && (
          <div className="fa-error">
            <p>{errorMsg || "صار في خلل. جربي كمان مرة."}</p>
            <button className="fa-btn" style={{ width: "auto", padding: "12px 26px" }} onClick={reset}>↻ ابدأي من جديد</button>
          </div>
        )}

        {step === "result" && report && (
          <div style={{ marginTop: 10 }}>
            <div style={{ textAlign: "center", marginBottom: 8 }}>
              <ScoreBadge score={report.overall_score} />
              <p className="fa-impression">{report.overall_impression}</p>
            </div>
            {(report.sections || []).map((sec, i) => {
              const meta = SECTION_META[sec.key] || { title: sec.key, icon: "•" };
              return <SectionCard key={sec.key || i} meta={meta} data={sec} />;
            })}
            {report.priority_actions?.length > 0 && (
              <div className="fa-priority">
                <h3>وين تبدأي؟</h3>
                <ol>{report.priority_actions.map((a, i) => <li key={i}>{a}</li>)}</ol>
              </div>
            )}
            <div className="fa-cta">
              <p>بدك خطة تنفيذية كاملة مبنية على مساحتك بالضبط؟</p>
              <button className="fa-btn" style={{ width: "auto", padding: "12px 26px" }}>✉ احجزي استشارة هندسة التدفق</button>
            </div>
            <button className="fa-btn fa-btn-ghost" onClick={reset}>فحص مساحة تانية</button>
          </div>
        )}
        <p className="fa-brand-foot">هندسة التدفق — إرغونوميا × فنغ شوي</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FlowAnalyzer />);
</script>
</body>
</html>
